name: Verify Identity
on:
  pull_request:
  push:
    branches: [dev, staging, main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm test
