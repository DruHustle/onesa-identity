name: Identity checks

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "migration/**"
      - "auth0/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".env.example"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".github/workflows/check.yml"
      - ".github/workflows/identity-checks.yml"
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
