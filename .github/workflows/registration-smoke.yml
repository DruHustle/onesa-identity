name: Onesa portfolio registration HTTP preflight
on:
  pull_request:
    paths: [scripts/portfolio-registration-smoke.mjs, .github/workflows/registration-smoke.yml]
  push:
    branches: [main]
    paths: [scripts/portfolio-registration-smoke.mjs, .github/workflows/registration-smoke.yml]
  workflow_dispatch:
    inputs:
      strict:
        type: boolean
        default: true
        description: Fail when public registration preflight cannot complete
permissions:
  contents: read
jobs:
  probe:
    name: HTTP registration audit (not customer signup acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Run public HTTP availability and PKCE preflight
        env:
          STRICT_LIVE_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict && '1' || '0' }}
        run: node scripts/portfolio-registration-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-registration-http-preflight
          path: registration-preflight.json
          if-no-files-found: warn
          retention-days: 7
