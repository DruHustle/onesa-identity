name: Auth0 custom-domain OIDC discovery
'on':
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'src/oidc-public-discovery.js'
      - 'scripts/probe-oidc-public.mjs'
      - 'test/oidc-public-discovery.test.js'
      - '.github/workflows/auth0-oidc-discovery.yml'
  push:
    branches: [dev, staging, main]
    paths:
      - 'src/oidc-public-discovery.js'
      - 'scripts/probe-oidc-public.mjs'
      - 'test/oidc-public-discovery.test.js'
      - '.github/workflows/auth0-oidc-discovery.yml'
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  public-oidc:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test public OIDC issuer and JWKS boundary
        run: node --test test/oidc-public-discovery.test.js
      - name: Observe live Auth0 public OIDC metadata (PR only, non-gating)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: node scripts/probe-oidc-public.mjs
      - name: Check actual Auth0 OIDC issuer and JWKS outside Oracle
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/probe-oidc-public.mjs
